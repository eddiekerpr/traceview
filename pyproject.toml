[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eddiekerpr-traceview"
version = "0.1.0"
description = "按时间戳还原调用顺序与耗时，标出并行与阻塞环节"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eddiekerpr" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eddiekerpr.github.io"
Repository = "https://github.com/eddiekerpr/traceview"
Issues = "https://github.com/eddiekerpr/traceview/issues"

[project.scripts]
traceview = "traceview:main"

[tool.setuptools]
py-modules = ["traceview"]
